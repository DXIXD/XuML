<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./colorui/main.css">
  <link rel="stylesheet" href="./colorui/icon.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffccd5 0%, #fcb6d0 30%, #f8a0c8 60%, #f189bf 100%);
      min-height: 100vh;
      background-image: url("https://img.icons8.com/fluency/96/000000/tulip.png");
      background-repeat: repeat;
      background-size: 60px;
      background-attachment: fixed;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      z-index: -1;
    }

    .photo-wall {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      justify-content: center;
    }
    .photo-item {
      width: calc(50% - 7.5px); /* 双排并列 */
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border: 3px solid;
      border-image: linear-gradient(to right, #ff99cc, #ff66b3) 1;
      padding-top: 75%; /* 4:3 比例 */
      position: relative;
    }
    .photo-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center; /* 人物居中 */
      transition: transform 0.3s;
    }
    .photo-item img:hover {
      transform: scale(1.05);
    }

    .countdown {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 10px;
      margin: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 2px solid;
      border-image: linear-gradient(to bottom, #ff99cc, #ff66b3) 1;
    }
    .letter {
      background: rgba(255, 255, 255, 0.85);
      margin: 20px;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      line-height: 1.8;
      border: 2px solid;
      border-image: linear-gradient(to bottom, #ff99cc, #ff66b3) 1;
    }
    .words {
      background: rgba(255, 255, 255, 0.85);
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 2px solid;
      border-image: linear-gradient(to bottom, #ff99cc, #ff66b3) 1;
    }
    .btn-heart {
      display: block;
      width: 80%;
      margin: 20px auto;
      padding: 15px;
      background: linear-gradient(to right, #ff66b3, #ff3399);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .btn-heart:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
  </style>
  <title>XuML专属小网站 ❤️</title>
</head>
<body>
  <div style="text-align: center; padding: 30px 0; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
    <h1 style="margin: 0; font-size: 30px;">❤️ 我的宝宝，全世界最可爱 ❤️</h1>
    <p style="font-size: 18px; margin-top: 10px;">今天也是超爱你的一天～</p>
  </div>

  <div class="countdown">
    <h2 class="text-pink">我们在一起已经</h2>
    <div style="font-size: 40px; color: #ff3399; font-weight: bold;" id="days">0 天</div>
    <p class="text-grey">距离下一个纪念日还有：<span id="nextDay">0 天</span></p>
  </div>

  <div class="words">
    <h3 class="text-purple"><span class="cuIcon-heartfill text-red"></span> 想对你说的话</h3>
    <div id="wordList" style="margin-top: 10px;">
      <p>不管发生什么，我都会永远陪着你 ❤️</p>
    </div>
    <button class="cu-btn bg-pink margin-top" onclick="changeWord()">换一句❤️</button>
  </div>

  <div style="margin: 20px;">
    <h3 class="text-white" style="text-shadow: 0 2px 4px rgba(0,0,0,0.2);"><span class="cuIcon-camerafill"></span> 我的专属小可爱</h3>
    <div class="photo-wall" id="photoWall">
      <!-- 示例占位，脚本会自动生成 -->
    </div>
  </div>

  <div class="letter">
    <h3 class="text-red"><span class="cuIcon-writefill"></span> 给宝贝的告白信</h3>
    <p style="margin-top: 10px;">宝宝：</p>
    <p>遇见你是我这辈子最幸运的事，我真的超爱你～</p>
    <p>愿我们永远在一起，每天都开开心心的～</p>
    <p style="text-align: right; margin-top: 20px;">爱你的XX ❤️</p>
  </div>

  <button class="btn-heart" onclick="surprise()">点击领取专属惊喜 💖</button>

  <audio autoplay loop style="display: none;">
    <source src="./暖风.mp3" type="audio/mpeg">
  

  <script>
    const loveStart = new Date(2025, 3, 24);
    const nextMemorial = new Date(2026, 3, 24);

    function calcDays() {
      const now = new Date();
      const diff = now - loveStart;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('days').innerText = days + ' 天';
      
      const nextDiff = nextMemorial - now;
      const nextDays = Math.max(0, Math.floor(nextDiff / (1000 * 60 * 60 * 24)));
      document.getElementById('nextDay').innerText = nextDays + ' 天';
    }
    calcDays();
    setInterval(calcDays, 1000);

    const wordList = [
      "宝宝，你是我见过最温柔的女孩子～",
      "不管发生什么，我都会永远陪着你 ❤️",
      "今天的你也超可爱，好想抱抱你～",
      "我的宝宝，不许不开心哦～",
      "赚钱给你花，把你宠成小公主～",
      "遇见你，花光了我所有的运气～"
    ];
    function changeWord() {
      const randomIndex = Math.floor(Math.random() * wordList.length);
      document.getElementById('wordList').innerHTML = `<p>${wordList[randomIndex]}</p>`;
    }

    function surprise() {
      alert(`❤️ 宝宝！\n我对你的爱，比天上的星星还多～\n这辈子只爱你一个人～`);
      const heart = document.createElement('div');
      heart.style.position = 'fixed';
      heart.style.color = 'red';
      heart.style.fontSize = '30px';
      heart.style.zIndex = '9999';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = Math.random() * 100 + 'vh';
      heart.style.animation = 'fall 3s linear';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }

    // 加载照片墙（使用jsDelivr CDN加速，加载速度更快）
    function loadPhotos() {
      const photoCount = 4;
      let html = '';
      for (let i = 1; i <= photoCount; i++) {
        // 🌟 关键：使用jsDelivr加速GitHub图片
        html += `
          <div class="photo-item">
            <img src="https://cdn.jsdelivr.net/gh/DXIXD/XuML@main/ML${i}.jpg" alt="宝宝的美照${i}">
          </div>
        `;
      }
      document.getElementById('photoWall').innerHTML = html;
    }
    loadPhotos();

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        0% {transform: translateY(-50px) rotate(0deg); opacity: 1;}
        100% {transform: translateY(100vh) rotate(360deg); opacity: 0;}
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
